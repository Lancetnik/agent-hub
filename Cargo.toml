[package]
name = "agent-hub"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
publish = false

[dependencies]
axum = "0.8"
futures-util = "0.3"
rmcp = { version = "3.5.1", features = ["transport-streamable-http-server"] }
rusqlite = { version = "0.40.2", default-features = false, features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal", "sync", "time"] }
tokio-util = "0.7"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
reqwest = { version = "0.13", default-features = false, features = ["json"] }
rmcp = { version = "3.5.1", features = ["client", "transport-streamable-http-client-reqwest"] }
tempfile = "3"
